name: Release macOS

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a semver version such as v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check release secrets
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret for ${name}" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign, notarize, and verify
        run: bun scripts/release-macos.ts "${{ steps.version.outputs.version }}"

      - name: Verify archives
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          unzip -t "apps/desktop/release/Carrent-${version}-intel.zip"
          unzip -t "apps/desktop/release/Carrent-${version}-apple-silicon.zip"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          assets=(
            "apps/desktop/release/Carrent-${version}-intel.dmg"
            "apps/desktop/release/Carrent-${version}-apple-silicon.dmg"
            "apps/desktop/release/Carrent-${version}-intel.zip"
            "apps/desktop/release/Carrent-${version}-apple-silicon.zip"
          )
          release_args=(--generate-notes --title "Carrent ${version}")
          if [[ "${version}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          elif ! gh release create "${GITHUB_REF_NAME}" "${assets[@]}" "${release_args[@]}"; then
            gh release view "${GITHUB_REF_NAME}" >/dev/null
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          fi
