name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Print versions
        run: |
          node --version
          bun --version

      - name: Verify actions are SHA-pinned
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 grep -nE '^[[:space:]]*uses:' \
            | grep -vE '@[0-9a-f]{40}( |$|#)' || true)
          if [[ -n "${bad}" ]]; then
            printf '::error::Unpinned action refs found:\n%s\n' "${bad}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test apps/desktop/electron apps/desktop/src

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
